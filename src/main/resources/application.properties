spring.application.name=bank-ms-credit
spring.profiles.active=local
springdoc.swagger-ui.url=/openapi.yaml
spring.config.import=optional:file:.env[.properties],optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888},optional:vault://
server.port=${SERVER_PORT:8083}
spring.cloud.config.enabled=${CONFIG_SERVER_ENABLED:true}
spring.cloud.config.import-check.enabled=false
spring.cloud.vault.uri=${VAULT_ADDR:http://127.0.0.1:8200}
spring.cloud.vault.token=${VAULT_TOKEN:}
spring.cloud.vault.kv.application-name=banca-project/${spring.application.name}

spring.sql.init.mode=${CREDIT_SCHEMA_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql
customer.eligibility-url=${CUSTOMER_ELIGIBILITY_URL:http://localhost:8080/api/v1/customer/documents}
customer.timeout=${CUSTOMER_TIMEOUT:2s}

spring.r2dbc.url=${CREDIT_R2DBC_URL}
spring.r2dbc.username=${CREDIT_DB_USERNAME}
spring.r2dbc.password=${CREDIT_DB_PASSWORD}
